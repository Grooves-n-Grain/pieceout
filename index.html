<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PieceOut - CNC Cut Preview</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="mode-preview">
    <div id="app">
        <header>
            <h1>PieceOut</h1>
            <nav id="tabs">
                <button id="tab-preview" class="tab-btn active" data-tab="preview">Preview</button>
                <button id="tab-layout" class="tab-btn" data-tab="layout">Layout</button>
            </nav>
            <div id="toolbar">
                <span class="preview-only toolbar-group">
                    <button id="btn-wireframe" class="toolbar-btn active" title="Wireframe view (W)">Wireframe</button>
                    <button id="btn-preview" class="toolbar-btn" title="Cut preview (F)">Preview</button>
                    <span class="separator"></span>
                </span>
                <button id="btn-zoom-in" class="toolbar-btn" title="Zoom in (+)">+</button>
                <button id="btn-zoom-out" class="toolbar-btn" title="Zoom out (-)">-</button>
                <button id="btn-zoom-fit" class="toolbar-btn" title="Fit to view (0)">Fit</button>
                <span class="separator"></span>
                <span class="preview-only toolbar-group">
                    <button id="btn-export-png" class="toolbar-btn" title="Export as PNG">Export PNG</button>
                    <span class="separator"></span>
                </span>
                <span class="layout-only toolbar-group">
                    <label id="sheet-picker" title="Sheet to display">
                        <span>Sheet:</span>
                        <select id="sheet-select"></select>
                    </label>
                    <button id="btn-export-sheet" class="toolbar-btn" title="Download this sheet as SVG">Export SVG</button>
                    <button id="btn-export-all" class="toolbar-btn" title="Download every sheet">Export all</button>
                    <button id="btn-send-preview" class="toolbar-btn" title="Open this sheet in the Preview tab">Send to Preview</button>
                    <span class="separator"></span>
                </span>
                <label id="bg-toggle" title="Toggle background">
                    <span>BG:</span>
                    <select id="bg-select">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                        <option value="checkerboard">Checker</option>
                    </select>
                </label>
            </div>
        </header>

        <div id="main">
            <aside id="sidebar" class="preview-only">
                <div id="sidebar-header">
                    <h2>Layers</h2>
                    <div id="layer-actions">
                        <button id="btn-all-cut" class="small-btn" title="Tag all as cut-through">All Cut</button>
                        <button id="btn-all-ignore" class="small-btn" title="Tag all as ignore">All Ignore</button>
                        <button id="btn-clear-tags" class="small-btn" title="Reset to auto-detect">Auto</button>
                    </div>
                </div>
                <div id="layer-list">
                    <p class="hint">Drop an SVG to see layers</p>
                </div>
                <div id="material-settings">
                    <h3>Material</h3>
                    <label>Color: <input type="color" id="material-color" value="#C4A265"></label>
                </div>
            </aside>

            <aside id="layout-sidebar" class="layout-only">
                <div id="layout-sidebar-header">
                    <h2>Layout</h2>
                    <label id="template-picker">
                        <span>Template:</span>
                        <select id="template-select"></select>
                    </label>
                </div>
                <div id="layout-form">
                    <details id="group-lamp" open>
                        <summary>Lamp</summary>
                        <div class="param-list"></div>
                    </details>
                    <details id="group-derived" open>
                        <summary>Derived</summary>
                        <div class="param-list"></div>
                    </details>
                    <details id="group-machine">
                        <summary>Machine &amp; sheets</summary>
                        <div class="param-list"></div>
                    </details>
                    <div id="layout-messages"></div>
                </div>
                <div id="layout-footer">
                    <button id="btn-layout-reset" class="small-btn" title="Reset every input to its default">Reset to defaults</button>
                </div>
            </aside>

            <div id="viewport-container">
                <div id="drop-zone" class="visible">
                    <div id="drop-zone-content">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                        </svg>
                        <p>Drop SVG file here</p>
                        <p class="sub">or click to browse</p>
                        <input type="file" id="file-input" accept=".svg" hidden>
                    </div>
                </div>
                <div id="viewport">
                    <svg id="svg-canvas" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
